<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="960" height="326" role="img"><title>Two real izvor diagnostics: wrong arguments to a call, and integer overflow at run time</title><style>@font-face{font-family:M;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="959" height="325" rx="16" fill="#0a0b0d" stroke="#1b2024"/><text x="32" y="46" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">$ </tspan><tspan fill="#c6ccd2">izvor run tests/golden/wrong-arguments.iz</tspan></text><text x="32" y="80" font-family="M" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" ><tspan fill="#e3645e">error</tspan><tspan fill="#e6e9ec">: &#x27;add&#x27; takes 2 arguments, found 3</tspan></text><text x="32" y="101" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d"> </tspan><tspan fill="#67d2cc">--&gt;</tspan><tspan fill="#8b949c"> tests/golden/wrong-arguments.iz:5:7</tspan></text><text x="32" y="122" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">  |</tspan></text><text x="32" y="143" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">5 |</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#c1a9ee">print</tspan><tspan fill="#7c858d">(</tspan><tspan fill="#ded38d">add</tspan><tspan fill="#7c858d">(</tspan><tspan fill="#f1bc7e">1</tspan><tspan fill="#7c858d">,</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#f1bc7e">2</tspan><tspan fill="#7c858d">,</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#f1bc7e">3</tspan><tspan fill="#7c858d">)</tspan><tspan fill="#7c858d">)</tspan><tspan fill="#7c858d">;</tspan></text><text x="32" y="164" font-family="M" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">  |</tspan><tspan fill="#e3645e">       ^</tspan></text><text x="32" y="185" font-family="M" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" ><tspan fill="#e3645e">error</tspan><tspan fill="#e6e9ec">: argument &#x27;b&#x27; of &#x27;add&#x27; must be Int, found Bool</tspan></text><text x="32" y="206" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d"> </tspan><tspan fill="#67d2cc">--&gt;</tspan><tspan fill="#8b949c"> tests/golden/wrong-arguments.iz:6:14</tspan></text><text x="32" y="227" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">  |</tspan></text><text x="32" y="248" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">6 |</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#c1a9ee">print</tspan><tspan fill="#7c858d">(</tspan><tspan fill="#ded38d">add</tspan><tspan fill="#7c858d">(</tspan><tspan fill="#f1bc7e">1</tspan><tspan fill="#7c858d">,</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#c1a9ee">true</tspan><tspan fill="#7c858d">)</tspan><tspan fill="#7c858d">)</tspan><tspan fill="#7c858d">;</tspan></text><text x="32" y="269" font-family="M" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">  |</tspan><tspan fill="#e3645e">              ^</tspan></text><line x1="492" y1="28" x2="492" y2="298" stroke="#15191c"/><text x="516" y="46" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">tests/golden/overflow.iz</tspan></text><text x="516" y="80" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#454d54">1  </tspan><tspan fill="#c1a9ee">print</tspan><tspan fill="#7c858d">(</tspan><tspan fill="#f1bc7e">1</tspan><tspan fill="#7c858d">)</tspan><tspan fill="#7c858d">;</tspan></text><text x="516" y="101" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#454d54">2  </tspan><tspan fill="#c1a9ee">let</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#d3d9de">big</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#7c858d">=</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#f1bc7e">9223372036854775807</tspan><tspan fill="#7c858d">;</tspan></text><text x="516" y="122" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#454d54">3  </tspan><tspan fill="#c1a9ee">print</tspan><tspan fill="#7c858d">(</tspan><tspan fill="#d3d9de">big</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#7c858d">+</tspan><tspan fill="#d3d9de"> </tspan><tspan fill="#f1bc7e">1</tspan><tspan fill="#7c858d">)</tspan><tspan fill="#7c858d">;</tspan></text><text x="516" y="165" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d">$ </tspan><tspan fill="#c6ccd2">izvor build tests/golden/overflow.iz -o ov &amp;&amp; ./ov</tspan></text><text x="516" y="199" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#e6e9ec">1</tspan></text><text x="516" y="220" font-family="M" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" ><tspan fill="#e3645e">error</tspan><tspan fill="#e6e9ec">: integer overflow</tspan></text><text x="516" y="241" font-family="M" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve" ><tspan fill="#5e666d"> </tspan><tspan fill="#67d2cc">--&gt;</tspan><tspan fill="#8b949c"> tests/golden/overflow.iz:3:11</tspan></text></svg>